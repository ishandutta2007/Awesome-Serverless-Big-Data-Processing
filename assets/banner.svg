<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: url(#title-grad); }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #f8fafc; }
      
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      
      .animated-bg-circle { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .animated-float { animation: floatSlow 8s ease-in-out infinite; transform-origin: center; }
      .data-stream { stroke-dasharray: 8 8; animation: dashMove 4s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Glowing Background Accents (Behind Text) -->
  <circle cx="150" cy="80" r="180" fill="#3b82f6" opacity="0.15" class="animated-bg-circle" />
  <circle cx="1050" cy="220" r="200" fill="#a855f7" opacity="0.15" class="animated-bg-circle" style="animation-delay: -3s;" />

  <!-- Background Data Nodes & Connection Lines (Lower Z-index) -->
  <g stroke="#475569" stroke-width="1.5" opacity="0.3">
    <line x1="100" y1="250" x2="250" y2="230" />
    <line x1="250" y1="230" x2="400" y2="260" />
    <line x1="800" y1="50" x2="950" y2="80" />
    <line x1="950" y1="80" x2="1100" y2="40" />
  </g>
  <g fill="#64748b" opacity="0.4">
    <circle cx="100" cy="250" r="4" />
    <circle cx="250" cy="230" r="6" />
    <circle cx="400" cy="260" r="5" />
    <circle cx="800" cy="50" r="5" />
    <circle cx="950" cy="80" r="7" />
    <circle cx="1100" cy="40" r="4" />
  </g>

  <!-- Animated Data Streams -->
  <path d="M 50 270 Q 300 240 600 270 T 1150 250" fill="none" stroke="#0ea5e9" stroke-width="2" class="data-stream" opacity="0.4" />
  <path d="M 50 30 Q 400 70 800 30 T 1150 60" fill="none" stroke="#8b5cf6" stroke-width="2" class="data-stream" opacity="0.4" style="animation-direction: reverse;" />

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(60, 115)">
    <!-- Main Title -->
    <text x="0" y="0" class="title" filter="url(#glow)">Awesome Serverless Big Data Processing</text>
    
    <!-- Subtitle -->
    <text x="0" y="42" class="subtitle">⚡ Curated List of SaaS Platforms &amp; Open-Source Distributed Compute Engines</text>

    <!-- Feature Pills / Badges in Foreground below text -->
    <g transform="translate(0, 75)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="80" y="20" text-anchor="middle" class="badge-text" fill="#38bdf8">🚀 Serverless Spark</text>

      <!-- Pill 2 -->
      <rect x="172" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="252" y="20" text-anchor="middle" class="badge-text" fill="#818cf8">📊 Lakehouse OLAP</text>

      <!-- Pill 3 -->
      <rect x="344" y="0" width="170" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
      <text x="429" y="20" text-anchor="middle" class="badge-text" fill="#c084fc">🔥 Federated SQL</text>
    </g>
  </g>
</svg>
